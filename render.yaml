services:
  - type: web
    name: sajumoon-server
    runtime: node
    plan: free
    branch: gh-pages
    buildCommand: npm ci --no-audit --no-fund && npm run build
    startCommand: node server/start.cjs
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: 24.19.0
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: FREE_TRIAL_MODE
        value: "true"
      - key: SALES_ENABLED
        value: "false"
      - key: POLICIES_APPROVED
        value: "false"
      - key: REPORT_ENGINE
        value: rules
      - key: ADMIN_SETUP_TOKEN
        generateValue: true
      - key: ORDER_DATA_SECRET
        generateValue: true
